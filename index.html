<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richiedi un'analisi della bolletta - TL Comunicazioni</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main class="contatto-container">
        <h1>Analisi gratuita della tua bolletta</h1>
        <p>Lascia i tuoi dati: un consulente di TL Comunicazioni ti contatterà a breve.</p>

        <form id="form-contatto-crm">
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="campo">
                <label for="telefono">Telefono</label>
                <input type="tel" id="telefono" name="telefono" required>
            </div>
            <button type="submit">Invia richiesta</button>
        </form>
    </main>

    <script src="assets/js/crm-form.js"></script>
</body>
</html>
